[build]
  command = "npm run build"
  publish = "dist"
  # Only build when docs, skills, schema, package.json, or CHANGELOG change
  # Paths are relative to base directory (docs/)
  # Exit 0 = skip build, exit 1 = build
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../skills ../schema ../package.json ../CHANGELOG.md"

[build.environment]
  NODE_VERSION = "22"

# Serve markdown and text files with correct content types
# Netlify headers use glob patterns; explicit paths for non-root files
[[headers]]
  for = "/skill.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-small.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/versions.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

