# Security headers (pre-launch audit 2026-10-21, L4), matching fleeet.space:
# frame-ancestors none + XFO DENY, nosniff, referrer policy, HSTS, CSP.
# Starlight inlines its theme and nav scripts, so script-src allows
# 'unsafe-inline' (no third-party script origins); Pagefind search needs
# 'wasm-unsafe-eval'. Tightening to hashes is a follow-up.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
