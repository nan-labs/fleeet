# Monthly, one grouped PR per ecosystem, to keep notifications low.
# Security updates still arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/docs"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
