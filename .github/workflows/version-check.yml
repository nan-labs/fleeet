# Fails when the kit version drifts between its copies, or when the skill,
# schema, CLI or plugin manifests change without a version bump.
# Same script as `npm run check` and the pre-commit hook.
name: version-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history: the base commit must be reachable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Syntax and drift
        run: npm run check
      - name: CLI tests
        run: npm test
      - name: Bump required for shipped changes
        env:
          # PR: the target branch tip. Push: the commit main pointed at before.
          # Empty / all zeros (first push) or missing (force-push) falls back to
          # HEAD~1 inside the script; a root commit gets the drift check only.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-version.mjs --range "$BASE" HEAD
