# Publishes a GitHub Release when a maintainer pushes a vX.Y.Z tag for a kit
# version that has no published release yet. It runs on the tag push, not on
# pushes to main, so merging a release commit never fails for lack of a tag. Process: CONTRIBUTING.md#releasing.
#
# 1. Reads the version from package.json.
# 2. Skips if the GitHub Release vX.Y.Z already exists.
# 3. Runs the version-sync check, lint (syntax), tests and docs build.
# 4. Needs the tag vX.Y.Z to exist already, created by a maintainer
#    (`npm run release`, then push the tag). A tag ruleset limits who can
#    create v* tags, so this workflow never creates or moves tags.
# 5. On green: writes SHA256SUMS, records a GitHub artifact attestation
#    (build provenance) for the release files, then publishes the GitHub
#    Release with that version's CHANGELOG.md section as notes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # publish the GitHub Release
      id-token: write      # sign the attestation (Sigstore)
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Version and release state
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already published; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version sync check
        if: steps.v.outputs.needed == 'true'
        run: npm run check:version
      - name: Lint (syntax + drift)
        if: steps.v.outputs.needed == 'true'
        run: npm run check
      - name: Test
        if: steps.v.outputs.needed == 'true'
        run: npm test
      - name: Build skill zip
        if: steps.v.outputs.needed == 'true'
        run: npm run pack-skill
      - name: Build docs
        if: steps.v.outputs.needed == 'true'
        working-directory: docs
        run: npm ci && npm run build

      - name: Release notes from CHANGELOG
        if: steps.v.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no notes for [$VERSION]"; exit 1
          fi
          cat release-notes.md

      - name: Require a maintainer-created tag
        if: steps.v.outputs.needed == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG doesn't exist. A maintainer creates and pushes it (npm run release)."
            exit 1
          fi
          if [ "$(git rev-list -n1 "$TAG")" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG points at $(git rev-list -n1 "$TAG"), not this commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG isn't on main."
            exit 1
          fi

      - name: Checksums
        if: steps.v.outputs.needed == 'true'
        working-directory: dist
        run: sha256sum fleeet-skill.zip > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance
        if: steps.v.outputs.needed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/fleeet-skill.zip

      - name: Publish
        if: steps.v.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file release-notes.md --latest \
            dist/fleeet-skill.zip dist/SHA256SUMS
